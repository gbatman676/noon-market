<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noon Market Admin</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

.card{
    background:#101d30;
    border:1px solid #263852;
    border-radius:16px;
    padding:25px;
    margin-bottom:20px;
}

h1{
    margin-top:0;
}

input,select,button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #344a68;
    background:#0b1728;
    color:white;
}

button{
    background:#1769ff;
    border:0;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0f57d6;
}

.hidden{
    display:none;
}

.user{
    border:1px solid #2b405e;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
}

.balance{
    font-size:25px;
    font-weight:bold;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.red{
    background:#c62828;
}

.green{
    background:#16834b;
}

#message{
    margin-top:15px;
    color:#ffcc66;
}
</style>
</head>

<body>

<div class="container">

<div id="loginBox" class="card">

<h1>Noon Market</h1>
<p>Secure Admin Panel</p>

<input
id="username"
placeholder="Admin username"
autocomplete="username"
>

<input
id="password"
type="password"
placeholder="Admin password"
autocomplete="current-password"
>

<button onclick="login()">
Sign In
</button>

<div id="loginMessage"></div>

</div>


<div id="panel" class="hidden">

<div class="card">

<h1>Admin Dashboard</h1>

<input
id="search"
placeholder="Search customer ID, email, phone..."
oninput="loadUsers()"
>

<button onclick="loadUsers()">
Refresh Users
</button>

<div id="users"></div>

</div>


<div id="details" class="card hidden">

<h2 id="customerTitle"></h2>

<div id="customerInfo"></div>

<input
id="amount"
type="number"
step="0.01"
placeholder="Amount"
>

<input
id="reason"
placeholder="Reason"
>

<div class="actions">

<button
class="green"
onclick="changeBalance('credit')"
>
Add Balance
</button>

<button
class="red"
onclick="changeBalance('debit')"
>
Remove Balance
</button>

</div>

<button onclick="toggleStatus()">
Suspend / Activate
</button>

<h3>Transactions</h3>

<div id="transactions"></div>

</div>

<div id="message"></div>

</div>

</div>


<script>

let token = "";
let selectedUser = null;

function showMessage(text){
    document.getElementById("message").textContent = text;
}

async function login(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const response =
        await fetch("/api/admin/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username,
                password
            })
        });

    const data =
        await response.json();

    if(!response.ok){

        document.getElementById(
            "loginMessage"
        ).textContent =
            data.error || "Login failed";

        return;
    }

    token = data.token;

    document.getElementById(
        "loginBox"
    ).classList.add("hidden");

    document.getElementById(
        "panel"
    ).classList.remove("hidden");

    loadUsers();
}


async function loadUsers(){

    if(!token) return;

    const q =
        document.getElementById(
            "search"
        ).value;

    const response =
        await fetch(
            "/api/admin/users?q=" +
            encodeURIComponent(q),
            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }
        );

    const data =
        await response.json();

    if(!response.ok){
        showMessage(
            data.error || "Failed"
        );
        return;
    }

    const box =
        document.getElementById("users");

    box.innerHTML = "";

    if(!data.users.length){
        box.innerHTML =
            "<p>No users found.</p>";
        return;
    }

    data.users.forEach(user => {

        const div =
            document.createElement("div");

        div.className = "user";

        div.innerHTML = `
            <strong>
                ${escapeHTML(user.customerId)}
            </strong>

            <p>
                ${escapeHTML(user.email)}
            </p>

            <p>
                ${escapeHTML(user.phone)}
            </p>

            <div class="balance">
                ${Number(user.balance).toFixed(2)}
            </div>

            <p>
                Status:
                ${escapeHTML(user.status)}
            </p>

            <button>
                Manage Account
            </button>
        `;

        div.querySelector("button")
            .onclick = () =>
                selectUser(user.id);

        box.appendChild(div);
    });
}


async function selectUser(id){

    const response =
        await fetch(
            "/api/admin/users/" + id,
            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }
        );

    const data =
        await response.json();

    if(!response.ok){
        showMessage(
            data.error || "User not found"
        );
        return;
    }

    selectedUser = data.user;

    document.getElementById(
        "details"
    ).classList.remove("hidden");

    document.getElementById(
        "customerTitle"
    ).textContent =
        data.user.customerId;

    renderUser(data.user);
    renderTransactions(data.transactions);
}


function renderUser(user){

    document.getElementById(
        "customerInfo"
    ).innerHTML = `
        <p>Email: ${escapeHTML(user.email)}</p>
        <p>Phone: ${escapeHTML(user.phone)}</p>
        <p>Status: ${escapeHTML(user.status)}</p>
        <div class="balance">
            Balance: ${Number(user.balance).toFixed(2)}
        </div>
    `;
}


function renderTransactions(list){

    const box =
        document.getElementById(
            "transactions"
        );

    box.innerHTML = "";

    if(!list.length){
        box.innerHTML =
            "<p>No transactions.</p>";
        return;
    }

    list.slice().reverse().forEach(tx => {

        const div =
            document.createElement("div");

        div.className = "user";

        div.innerHTML = `
            <strong>${escapeHTML(tx.type)}</strong>
            <p>Amount: ${Number(tx.amount).toFixed(2)}</p>
            <p>Reason: ${escapeHTML(tx.reason || "")}</p>
            <small>${escapeHTML(tx.time || "")}</small>
        `;

        box.appendChild(div);
    });
}


async function changeBalance(type){

    if(!selectedUser) return;

    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );

    const reason =
        document.getElementById(
            "reason"
        ).value;

    if(!Number.isFinite(amount) || amount <= 0){
        showMessage(
            "Enter a valid amount."
        );
        return;
    }

    const response =
        await fetch(
            "/api/admin/users/" +
            selectedUser.id +
            "/balance",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json",
                    Authorization:
                        "Bearer " + token
                },
                body:JSON.stringify({
                    type,
                    amount,
                    reason
                })
            }
        );

    const data =
        await response.json();

    if(!response.ok){
        showMessage(
            data.error || "Balance update failed"
        );
        return;
    }

    selectedUser = data.user;

    renderUser(data.user);

    document.getElementById(
        "amount"
    ).value = "";

    document.getElementById(
        "reason"
    ).value = "";

    await loadUsers();

    const refreshed =
        await fetch(
            "/api/admin/users/" +
            selectedUser.id,
            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }
        );

    const refreshedData =
        await refreshed.json();

    renderTransactions(
        refreshedData.transactions || []
    );

    showMessage(
        "Balance updated successfully."
    );
}


async function toggleStatus(){

    if(!selectedUser) return;

    const newStatus =
        selectedUser.status === "suspended"
            ? "active"
            : "suspended";

    const response =
        await fetch(
            "/api/admin/users/" +
            selectedUser.id +
            "/status",
            {
                method:"PATCH",
                headers:{
                    "Content-Type":
                        "application/json",
                    Authorization:
                        "Bearer " + token
                },
                body:JSON.stringify({
                    status:newStatus
                })
            }
        );

    const data =
        await response.json();

    if(!response.ok){
        showMessage(
            data.error || "Status update failed"
        );
        return;
    }

    selectedUser = data.user;

    renderUser(data.user);
    loadUsers();

    showMessage(
        "Account status updated."
    );
}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
