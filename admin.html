<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noon Market Admin</title><style>body{font:15px Arial;margin:0;background:#f5f6f8;color:#101828}.wrap{max-width:1100px;margin:auto;padding:25px}.box,.user{background:#fff;border-radius:16px;padding:18px;margin:10px 0}.user{display:flex;justify-content:space-between;align-items:center;gap:12px}input,select,button{padding:11px;border:1px solid #d0d5dd;border-radius:10px;margin:4px}button{cursor:pointer}.primary{background:#111827;color:#fff}.muted{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}.user{display:block}}</style></head><body><main class="wrap"><h1>Noon Market Admin</h1><section id="login" class="box"><input id="au" placeholder="Admin username"><input id="ap" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Sign In</button><p class="muted">Use ADMIN_USER and ADMIN_PASSWORD environment variables for production.</p></section><section id="panel" style="display:none"><div class="box"><input id="q" placeholder="Search email, phone or user ID"><button onclick="loadUsers()">Search</button><button onclick="loadUsers()">Refresh</button></div><div id="users"></div><div id="detail"></div></section></main><script>let token='';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){try{let d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:au.value,password:ap.value})});token=d.token;document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';loadUsers()}catch(e){alert(e.message)}}async function loadUsers(){let d=await api('/api/admin/users?q='+encodeURIComponent(q.value));users.innerHTML=d.users.map(x=>`<div class=user><div><b>${esc(x.email||x.phone)}</b><div class=muted>${x.id} · ${x.status}</div></div><div><b>$${Number(x.balance).toFixed(2)}</b><button onclick="openUser('${x.id}')">Open</button></div></div>`).join('')||'<p>No users found.</p>'}async function openUser(id){let d=await api('/api/admin/users/'+id);detail.innerHTML=`<div class=box><h2>User</h2><p><b>Email:</b> ${esc(d.user.email||'—')}</p><p><b>Phone:</b> ${esc(d.user.phone||'—')}</p><p><b>Balance:</b> $${Number(d.user.balance).toFixed(2)}</p><p><b>Status:</b> ${d.user.status}</p><div class=grid><div><h3>Ledger entry</h3><select id=typ><option value=credit>Credit</option><option value=debit>Debit</option></select><input id=amt type=number step=0.01 placeholder="Amount"><input id=reason placeholder="Reason / reference"><button class=primary onclick="changeBalance('${id}')">Record Entry</button></div><div><h3>Account status</h3><button onclick="changeStatus('${id}','${d.user.status==='active'?'suspended':'active'}')">${d.user.status==='active'?'Suspend Account':'Activate Account'}</button></div></div><h3>Transactions</h3>${d.transactions.map(t=>`<p>${t.type} · $${Number(t.amount).toFixed(2)} · ${esc(t.reason)} · ${new Date(t.time).toLocaleString()}</p>`).join('')||'<p class=muted>No transactions.</p>'}</div>`}async function changeBalance(id){try{await api('/api/admin/users/'+id+'/balance',{method:'POST',body:JSON.stringify({type:typ.value,amount:Number(amt.value),reason:reason.value})});openUser(id);loadUsers()}catch(e){alert(e.message)}}async function changeStatus(id,status){try{await api('/api/admin/users/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});openUser(id);loadUsers()}catch(e){alert(e.message)}}</script></body></html>
