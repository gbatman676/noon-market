<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Noon Market Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #16284a,
                    #050914 55%,
                    #02040a
                );
            color: #fff;
        }

        .wrap {
            width: min(1200px, 94%);
            margin: 35px auto;
        }

        .card {
            background: rgba(12, 20, 38, .94);
            border: 1px solid #243452;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        h1 {
            margin-top: 0;
        }

        input,
        button,
        select {
            border: 0;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
        }

        input {
            width: 100%;
            background: #0a1222;
            color: white;
            border: 1px solid #273858;
            margin-bottom: 12px;
        }

        button {
            cursor: pointer;
            font-weight: bold;
            background: #2563eb;
            color: white;
        }

        button:hover {
            opacity: .88;
        }

        .danger {
            background: #dc2626;
        }

        .success {
            background: #16a34a;
        }

        .hidden {
            display: none !important;
        }

        .login {
            max-width: 430px;
            margin: 100px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search {
            margin-bottom: 20px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #14532d;
            color: #86efac;
        }

        .suspended {
            background: #7f1d1d;
            color: #fecaca;
        }

        .users {
            display: grid;
            gap: 14px;
        }

        .user {
            border: 1px solid #263653;
            border-radius: 14px;
            padding: 18px;
            background: #091221;
        }

        .user-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .muted {
            color: #8fa0bd;
            font-size: 13px;
        }

        .balance {
            font-size: 25px;
            font-weight: bold;
            margin: 12px 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .message {
            margin-top: 12px;
            color: #fca5a5;
        }

        .details {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #243452;
        }
    </style>
</head>

<body>

<div id="loginBox" class="login card">

    <h1>Noon Market</h1>

    <p class="muted">
        Secure Admin Panel
    </p>

    <input
        id="username"
        placeholder="Admin username"
        autocomplete="username"
    >

    <input
        id="password"
        type="password"
        placeholder="Admin password"
        autocomplete="current-password"
    >

    <button
        style="width:100%"
        onclick="login()"
    >
        Sign In
    </button>

    <div
        id="loginMessage"
        class="message"
    ></div>
</div>


<div
    id="panel"
    class="wrap hidden"
>

    <div class="card">

        <div class="top">

            <div>
                <h1>Noon Market Admin</h1>

                <div
                    id="count"
                    class="muted"
                >
                    Customers: 0
                </div>
            </div>

            <button
                class="danger"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

        <input
            id="search"
            class="search"
            placeholder="Search email, phone, ID..."
            oninput="loadUsers()"
        >

        <div
            id="message"
            class="message"
        ></div>

        <div
            id="users"
            class="users"
        ></div>

    </div>
</div>


<script>

let adminToken =
    localStorage.getItem(
        "noon_admin_token"
    ) || "";


function apiHeaders() {

    return {
        "Content-Type":
            "application/json",

        "Authorization":
            "Bearer " +
            adminToken
    };
}


async function login() {

    const username =
        document.getElementById(
            "username"
        ).value;

    const password =
        document.getElementById(
            "password"
        ).value;

    const message =
        document.getElementById(
            "loginMessage"
        );

    message.textContent = "";

    try {

        const response =
            await fetch(
                "/api/admin/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Login failed"
            );
        }

        adminToken =
            data.token;

        localStorage.setItem(
            "noon_admin_token",
            adminToken
        );

        document
            .getElementById(
                "loginBox"
            )
            .classList.add(
                "hidden"
            );

        document
            .getElementById(
                "panel"
            )
            .classList.remove(
                "hidden"
            );

        loadUsers();

    } catch (error) {

        message.textContent =
            error.message;
    }
}


function logout() {

    adminToken = "";

    localStorage.removeItem(
        "noon_admin_token"
    );

    location.reload();
}


async function loadUsers() {

    if (!adminToken) {
        return;
    }

    const query =
        document.getElementById(
            "search"
        ).value.trim();

    try {

        const response =
            await fetch(
                "/api/admin/users?q=" +
                encodeURIComponent(query),
                {
                    headers:
                        apiHeaders()
                }
            );

        const data =
            await response.json();

        if (
            response.status === 401
        ) {
            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Unable to load users"
            );
        }

        renderUsers(
            data.users || []
        );

    } catch (error) {

        document.getElementById(
            "message"
        ).textContent =
            error.message;
    }
}


function renderUsers(users) {

    document.getElementById(
        "count"
    ).textContent =
        "Customers: " +
        users.length;

    const container =
        document.getElementById(
            "users"
        );

    if (!users.length) {

        container.innerHTML =
            `<div class="muted">
                No customers found.
             </div>`;

        return;
    }

    container.innerHTML =
        users.map(user => {

            const status =
                user.status ===
                "suspended"
                    ? "suspended"
                    : "active";

            const statusText =
                status === "active"
                    ? "ACTIVE"
                    : "SUSPENDED";

            return `
                <div class="user">

                    <div class="user-head">

                        <div>
                            <strong>
                                ${escapeHTML(
                                    user.customerId ||
                                    user.id
                                )}
                            </strong>

                            <div class="muted">
                                ${escapeHTML(
                                    user.email ||
                                    user.phone ||
                                    ""
                                )}
                            </div>
                        </div>

                        <span
                            class="status ${status}"
                        >
                            ${statusText}
                        </span>

                    </div>

                    <div class="balance">
                        $${Number(
                            user.balance || 0
                        ).toFixed(2)}
                    </div>

                    <div class="muted">
                        ID:
                        ${escapeHTML(
                            user.id
                        )}
                    </div>

                    <div class="actions">

                        <button
                            onclick="viewUser(
                                '${encodeURIComponent(
                                    user.id
                                )}'
                            )"
                        >
                            Details
                        </button>

                        ${
                            status === "active"
                                ? `
                                    <button
                                        class="danger"
                                        onclick="changeStatus(
                                            '${encodeURIComponent(
                                                user.id
                                            )}',
                                            'suspended'
                                        )"
                                    >
                                        Close Account
                                    </button>
                                  `
                                : `
                                    <button
                                        class="success"
                                        onclick="changeStatus(
                                            '${encodeURIComponent(
                                                user.id
                                            )}',
                                            'active'
                                        )"
                                    >
                                        Open Account
                                    </button>
                                  `
                        }

                    </div>

                    <div
                        id="details-${encodeURIComponent(
                            user.id
                        )}"
                        class="details hidden"
                    ></div>

                </div>
            `;

        }).join("");
}


async function changeStatus(
    encodedId,
    status
) {

    const id =
        decodeURIComponent(
            encodedId
        );

    const action =
        status === "active"
            ? "open"
            : "close";

    if (
        !confirm(
            "Are you sure you want to " +
            action +
            " this account?"
        )
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/admin/users/" +
                encodeURIComponent(id) +
                "/status",
                {
                    method: "PATCH",

                    headers:
                        apiHeaders(),

                    body:
                        JSON.stringify({
                            status
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Status update failed"
            );
        }

        loadUsers();

    } catch (error) {

        alert(error.message);
    }
}


async function viewUser(
    encodedId
) {

    const id =
        decodeURIComponent(
            encodedId
        );

    const box =
        document.getElementById(
            "details-" +
            encodedId
        );

    if (!box) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/admin/users/" +
                encodeURIComponent(id),
                {
                    headers:
                        apiHeaders()
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Unable to load details"
            );
        }

        const transactions =
            Array.isArray(
                data.transactions
            )
                ? data.transactions
                : [];

        box.classList.remove(
            "hidden"
        );

        if (!transactions.length) {

            box.innerHTML =
                `<div class="muted">
                    No transactions recorded.
                 </div>`;

            return;
        }

        box.innerHTML =
            transactions
                .slice()
                .reverse()
                .map(t => {

                    return `
                        <div
                            style="
                                padding:10px 0;
                                border-bottom:
                                1px solid #243452;
                            "
                        >
                            <strong>
                                ${escapeHTML(
                                    t.type || ""
                                )}
                            </strong>

                            —
                            $${Number(
                                t.amount || 0
                            ).toFixed(2)}

                            <div class="muted">
                                ${escapeHTML(
                                    t.reason || ""
                                )}
                            </div>

                            <div class="muted">
                                ${escapeHTML(
                                    t.time || ""
                                )}
                            </div>
                        </div>
                    `;

                })
                .join("");

    } catch (error) {

        box.classList.remove(
            "hidden"
        );

        box.textContent =
            error.message;
    }
}


function escapeHTML(value) {

    return String(
        value == null
            ? ""
            : value
    )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


if (adminToken) {

    document
        .getElementById(
            "loginBox"
        )
        .classList.add(
            "hidden"
        );

    document
        .getElementById(
            "panel"
        )
        .classList.remove(
            "hidden"
        );

    loadUsers();
}

</script>

</body>
</html>
